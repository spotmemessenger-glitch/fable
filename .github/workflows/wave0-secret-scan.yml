# Wave 0 — secret-pattern scan for the ops scripts and Wave-0 docs.
#
# Detects likely secret VALUES (tokens, keys, credentialed URLs) that must never
# be committed, while deliberately NOT rejecting ordinary env NAMES like
# S3_SECRET_ACCESS_KEY or JWT_ACCESS_SECRET. Wave 0's discipline is "reference
# env NAMES only, never values" — this guards that invariant in CI.
name: wave0-secret-scan

on:
  pull_request:
    paths:
      - 'spotme/docs/ops/**'
      - 'spotme/docs/reports/wave-0-*.md'
      - 'spotme/backend/src/scripts/wave0/**'
      - '.github/workflows/wave0-secret-scan.yml'
  push:
    paths:
      - 'spotme/docs/ops/**'
      - 'spotme/docs/reports/wave-0-*.md'
      - 'spotme/backend/src/scripts/wave0/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Wave-0 paths for likely secret values
        run: |
          set -uo pipefail
          PATHS="spotme/docs/ops spotme/docs/reports/wave-0-final.md spotme/backend/src/scripts/wave0"
          # Value patterns (structured secrets), NOT env-name patterns:
          #  - PostHog personal/project keys: phx_… / phc_…
          #  - AWS access key id: AKIA…
          #  - PEM private key blocks
          #  - credentialed URLs: scheme://user:pass@host
          #  - JWTs: eyJ….….…
          PATTERN='phx_[A-Za-z0-9]{16,}|phc_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|[a-z][a-z0-9+.-]*://[^/@[:space:]]+:[^/@[:space:]]+@|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{6,}'
          if grep -rInE "$PATTERN" $PATHS ; then
            echo "::error::Likely secret VALUE found in a Wave-0 path. Reference env NAMES only, never values."
            exit 1
          fi
          echo "OK — no secret-shaped values in Wave-0 ops scripts or docs."
