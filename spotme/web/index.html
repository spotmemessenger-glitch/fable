<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    viewport-fit=cover plus the safe-area insets in tokens.css keep the composer
    clear of the iPhone home indicator. Without it the send button sits under
    the gesture bar and is genuinely hard to tap.

    No maximum-scale/user-scalable lock: that disables pinch-zoom, which is an
    accessibility failure for anyone who needs to magnify text, and Apple
    itself now ignores the restriction — so it was doing nothing but locking
    out Android users who could still use it. interactive-widget=resizes-content
    tells Android to shrink the layout for the on-screen keyboard rather than
    scroll the page underneath it, which is what the composer needs.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- Teal, not white: on Android the theme colour paints the status bar, and
       white made the bar vanish into the header. -->
  <meta name="theme-color" content="#1b8a9d" />
  <meta name="description" content="Spot Me — meet people nearby, chat in any language. Peer-to-peer: no accounts, no servers." />

  <!-- Installable. Without a manifest the app can be bookmarked but never
       installed: no icon, no name, and the browser chrome stays on screen. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- iOS ignores the manifest entirely and reads these instead. -->
  <meta name="apple-mobile-web-app-title" content="Spot Me" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <title>Spot Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    LOADED ASYNCHRONOUSLY, ON PURPOSE — first paint must never wait on a font CDN.

    `display=swap` was already in the URL and it is NOT enough: it governs the
    FONT FILES once this stylesheet has arrived. The stylesheet itself was a
    render-blocking request to a third party, so a user whose network cannot
    reach fonts.googleapis.com — a privacy blocker, a corporate proxy, a censored
    region, or simply a bad mobile link — got a BLANK SCREEN until it resolved or
    timed out. The overnight harness measured ~12.9s to first paint, identically
    at 1x and 4x CPU throttle; identical across throttle rates is what proves it
    was never CPU-bound. It was this request.

    `media="print"` lets the browser fetch without blocking rendering; the onload
    handler promotes it to `all` once it lands. Text paints immediately in the
    system stack (`--font` already falls back to -apple-system/Segoe/Roboto) and
    swaps to Sora when the webfont is ready. The <noscript> copy keeps the font
    for scripted-off browsers, where the async promotion cannot run.
  -->
  <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  </noscript>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
