<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    viewport-fit=cover plus the safe-area insets in style.css keep the composer
    clear of the iPhone home indicator. Without it the send button sits under
    the gesture bar and is genuinely hard to tap.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Spot Me — meet people nearby, chat in any language. Peer-to-peer: no accounts, no servers." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Spot Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
