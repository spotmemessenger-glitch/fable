# Spot Me — LOCAL DEVELOPMENT & CI ONLY.
#
# This stack is never deployed. Production Postgres is managed (Neon/Railway),
# the cache/queue/broker runtime is Dragonfly Cloud reached only through
# REDIS_URL (env), and search (once chosen) runs as a managed service. Nothing
# here carries a production hostname, credential, or deploy reference — the
# passwords below are throwaway values scoped to a developer's laptop or an
# ephemeral CI job.
#
# STANDARD STACK (starts by default):
#   docker compose -f spotme/docker-compose.dev.yml up -d
#   → Postgres+PostGIS :5432 · Valkey :6379
#
# SEARCH BENCHMARK (opt-in profile — heavy, only when benchmarking search):
#   docker compose -f spotme/docker-compose.dev.yml --profile search-benchmark up -d
#   → additionally Meilisearch :7700 · Typesense :8108
#
# Meilisearch and Typesense sit behind the `search-benchmark` profile so every
# ordinary dev session and CI job does NOT pay their RAM/startup cost. They exist
# only to be measured side by side (the benchmark harness); the owner picks one
# afterwards and only then is an engine wired into the app.
#
# Valkey is the local stand-in for the Dragonfly Cloud Redis-protocol runtime
# (cache + BullMQ + later the Centrifugo broker). Same ioredis client, different
# REDIS_URL (env) — never hardcoded.

name: spotme-dev

services:
  postgres:
    # PostGIS bundled so the additive CREATE EXTENSION migration applies locally
    # exactly as it will in the managed database.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: spotme
      POSTGRES_PASSWORD: spotme-dev-only
      POSTGRES_DB: spotme
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spotme']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    # Redis-protocol; ioredis talks to this in dev/CI and to Dragonfly Cloud in
    # production. Same client, different REDIS_URL (env) — never hardcoded.
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    # Search benchmark candidate A — opt-in only. Dev/CI, never deployed.
    image: getmeili/meilisearch:v1.10
    profiles: ['search-benchmark']
    environment:
      MEILI_MASTER_KEY: spotme-dev-only-meili
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    # Search benchmark candidate B — opt-in only. Dev/CI, never deployed.
    image: typesense/typesense:27.1
    profiles: ['search-benchmark']
    command:
      - '--data-dir=/data'
      - '--api-key=spotme-dev-only-typesense'
      - '--enable-cors'
    ports:
      - '8108:8108'
    volumes:
      - typesensedata:/data
    healthcheck:
      test: ['CMD-SHELL', "curl -fsS http://localhost:8108/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  meilidata:
  typesensedata:
