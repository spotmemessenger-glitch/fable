[project]
name = "jarvis"
version = "0.1.0"
description = "A personal assistant with voice, memory, and tools"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117",
    "elevenlabs>=2.0",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "psutil>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Native microphone listening — needs the portaudio C library to build.
# Required on a real desktop (see start-jarvis.bat); skipped in cloud
# deploys, where there's no physical mic for it to use anyway.
# jarvis.voice.native_listener already degrades gracefully without it.
voice = ["SpeechRecognition>=3.14", "PyAudio>=0.2.14"]

[project.scripts]
jarvis = "jarvis.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
